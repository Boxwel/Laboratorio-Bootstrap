<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Lista de Tareas</title>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid justify-content-center">
            <a class="navbar-brand" href="#">
                <img src="/img/logo.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                ListaTareas
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item active">
                        <a class="nav-link" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#tareas">Tareas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#agregar">Agregar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 flex-grow-1">
        <div id="alertaExito" class="alert alert-success alert-dismissible fade show d-none" role="alert">
            <i class="bi bi-check-circle-fill"></i> ¡Tarea agregada correctamente!
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card mx-auto shadow-sm" style="max-width: 30rem;">
            <div class="card-body text-center">
                <h5 class="card-title fw-semibold fs-2">
                    Lista de tareas <i class="bi bi-calendar4-event"></i>
                </h5>
                <p class="card-text p-2">Añade tu lista de tareas</p>
                
                <form id="formTarea" class="mb-4">
                    <div class="input-group">
                        <input type="text" id="inputTarea" class="form-control" placeholder="Escribir tarea" required>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-plus-circle"></i> Agregar
                        </button>
                    </div>
                </form>

                <div id="listaTareas" class="list-group">
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <span>Ejemplo de tarea</span>
                        <button class="btn btn-outline-danger btn-sm">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-light py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-2">Santiago Ramírez Escobar</p>
            <div class="social-links">
                <a href="https://www.linkedin.com/in/santiago-ramirez-desarrollador-frontend/" class="text-light me-3" target="_blank">
                    <i class="bi bi-linkedin fs-4"></i>
                </a>
                <a href="https://github.com/Boxwel" class="text-light" target="_blank">
                    <i class="bi bi-github fs-4"></i>
                </a>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
